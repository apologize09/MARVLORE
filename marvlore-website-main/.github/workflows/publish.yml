name: Publish website
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 确认将所选分支发布到 MARVLORE 官网
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: marvlore-production
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check
      - name: Publish and verify existing website
        run: node scripts/publish-here-now.mjs
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
